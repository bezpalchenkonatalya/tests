<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тести</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #3b5bdb;
    --accent-hover: #2f4bc4;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  .state-message {
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
  }
  .state-message.error { color: #b91c1c; border-color: #fca5a5; background: #fef2f2; }
  ul.test-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  ul.test-list li {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  ul.test-list a {
    display: block;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
  }
  ul.test-list a:hover { color: var(--accent); }
  ul.test-list a::after {
    content: "→";
    float: right;
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Тести</h1>
    <p class="subtitle">Обери тест зі списку нижче</p>
    <div id="content">
      <div class="state-message" id="loading">Завантаження списку тестів…</div>
    </div>
  </div>

<script>
  const OWNER = "bezpalchenkonatalya";
  const REPO = "tests";
  const BRANCH = "main";
  const FOLDER = "tests";

  const contentEl = document.getElementById("content");

  function humanTitle(filename) {
    return filename
      .replace(/\.html?$/i, "")
      .replace(/[-_]+/g, " ")
      .trim();
  }

  async function loadTests() {
    const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;
    try {
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const items = await res.json();
      const files = items
        .filter(it => it.type === "file" && /\.html?$/i.test(it.name))
        .sort((a, b) => a.name.localeCompare(b.name, "uk"));

      if (files.length === 0) {
        contentEl.innerHTML = `<div class="state-message">Поки що тестів немає. Додай файл у папку "${FOLDER}".</div>`;
        return;
      }

      const list = document.createElement("ul");
      list.className = "test-list";
      contentEl.innerHTML = "";
      contentEl.appendChild(list);

      // Створюємо пункти одразу з назвою файлу, потім у фоні
      // підміняємо текст на справжній <title> з кожного тесту.
      const items2 = files.map(f => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `${FOLDER}/${f.name}`;
        a.textContent = humanTitle(f.name);
        li.appendChild(a);
        list.appendChild(li);
        return { file: f, link: a };
      });

      items2.forEach(async ({ file, link }) => {
        try {
          const raw = await fetch(file.download_url).then(r => r.text());
          const match = raw.match(/<title>([^<]*)<\/title>/i);
          if (match && match[1].trim()) link.textContent = match[1].trim();
        } catch (e) {
          // лишаємо назву файлу як запасний варіант
        }
      });
    } catch (err) {
      contentEl.innerHTML = `<div class="state-message error">Не вдалося завантажити список тестів. Перевір, що сторінка відкрита через GitHub Pages (не просто як файл), і що назву акаунта/репозиторію в index.html вказано правильно.</div>`;
      console.error(err);
    }
  }

  loadTests();
</script>
</body>
</html>
